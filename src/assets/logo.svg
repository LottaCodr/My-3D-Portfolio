<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Mr. Lotta logo">
  <!-- Gold rounded tile: the single brand colour, #cfa96e, matching the
       site's accent and the hero's dot motif. -->
  <rect width="64" height="64" rx="15" fill="#cfa96e"/>
  <!-- Geometric "L" monogram in the site's ink colour. -->
  <path d="M19 16h10v20h16v10H19z" fill="#0a0a0f"/>
  <!-- Aligned square accent: a terminal-cursor echo of the hero dot.
       Right edge aligns with the foot (x=45), top edge with the stem (y=16). -->
  <rect x="37" y="16" width="8" height="8" fill="#0a0a0f"/>
</svg>
